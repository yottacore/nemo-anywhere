# Every Windows bundle gets this: the zip, the setup exe and install.ps1 copy
# made from it, and the single exe. The stock mingw64 etc/gtk-3.0 has none, so
# GTK falls back to Adwaita and a thin substitute font. Segoe UI 9 is the
# Windows default UI font. Fluent and Mica are compiled into the app.
[Settings]
gtk-font-name = Segoe UI 9
gtk-xft-antialias = 1
gtk-xft-hinting = 1
gtk-xft-hintstyle = hintfull
gtk-xft-rgba = rgb
gtk-theme-name = Fluent
gtk-icon-theme-name = Mica
