# Release-only Windows build, pack, and sign.
#
# Why this exists: it was introduced because SignPath Foundation (free OSS code
# signing) will only sign artifacts built by a verifiable CI system, never a
# locally-built exe. That application was refused and signing is deferred, so what
# this earns its keep for now is being the reproducible public build of the
# released Windows single-exe. Day-to-day dev and dogfooding stay local
# (cicd-win.ps1); only the release artifact runs through this.
#
# It mirrors the known-good local chain: MSYS2/mingw64 meson+ninja build ->
# stage-native.bash (self-contained bundle) -> pack-portable.ps1 (EVB single exe).
#
# The SignPath step below is left in place but dormant: it is gated on the
# SIGNPATH_API_TOKEN secret, which is not set, so the job builds and attaches the
# UNSIGNED exe and never hard-fails on a missing cert. Nothing here needs unpicking
# if signing is picked back up. See cicd/win/signing.md for where that stands and
# what the alternatives are.
#
# Triggers: a pushed v* tag (the release cut), or a manual run for a build/pack
# smoke without releasing.

name: release-win

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # attach assets to the GitHub Release
  id-token: write   # SignPath origin verification (OIDC)

jobs:
  build-sign-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: MSYS2 mingw64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-json-glib
            mingw-w64-x86_64-libexif
            mingw-w64-x86_64-libgsf
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-desktop-file-utils
            intltool

      # The linker writes a timestamp into the PE header, and left alone it writes
      # the clock, so the same tag would build to different bytes every run.
      - name: Build (meson + ninja)
        shell: msys2 {0}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          meson setup --buildtype=release -Dstrip=true -Db_lto=true -Db_lto_threads=4 -Dxmp=false build source
          ninja -C build

      - name: Stage self-contained runtime bundle
        shell: msys2 {0}
        run: bash cicd/win/stage-native.bash build cicd/artifacts/win-run

      - name: Pack single exe (Enigma Virtual Box)
        shell: pwsh
        run: |
          # The community feed hands out a 503 often enough to lose a release cut
          # on its own, so the install gets a few tries before the job gives up.
          $PSNativeCommandUseErrorActionPreference = $false
          $installed = $false
          foreach ($try in 1..3) {
            choco install enigmavirtualbox --ignore-checksums -y --no-progress
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            Write-Host "choco install failed on attempt $try"
            Start-Sleep -Seconds (20 * $try)
          }
          if (-not $installed) { throw "could not install Enigma Virtual Box" }
          pwsh -File cicd/win/pack-portable.ps1
          if (-not (Test-Path cicd/artifacts/win-portable/nemo-anywhere.exe)) {
            throw "pack produced no exe"
          }

      - name: Upload unsigned exe (build artifact + input to signing)
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: nemo-anywhere-win64-unsigned
          path: cicd/artifacts/win-portable/nemo-anywhere.exe
          if-no-files-found: error

      # Submit the built exe to SignPath. Skipped (leaving the exe unsigned) until
      # SIGNPATH_API_TOKEN is set, so an unconfigured repo still produces a build.
      # Input names track the action's README - re-check them at setup time.
      - name: Sign with SignPath
        id: sign
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: nemo-anywhere
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Notes come from the changelog section for this version, the same way the
      # local cut writes them. Writes nothing if that fails, and the publish step
      # then falls back to the generated commit list rather than an empty body.
      - name: Release notes from changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash cicd/utility/release-notes.bash "${GITHUB_REF_NAME}" > release-notes.md || rm -f release-notes.md

      # Attach to the release on a tag build. Prefer the signed exe when present.
      # Creates the release if the tag push arrived before release.bash made one.
      # A SemVer prerelease tag (a hyphen after the version core, e.g. v1.0.0-rc1 or
      # v0.9.0-beta) is marked prerelease; a plain v<version> is marked latest. The
      # flag and the notes are enforced on edit too, so a release that already
      # existed ends up with both right.
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $exe = if (Test-Path signed/nemo-anywhere.exe) { "signed/nemo-anywhere.exe" }
                 else { "cicd/artifacts/win-portable/nemo-anywhere.exe" }
          $rel = if ($env:TAG -match '-') { "--prerelease" } else { "--latest" }
          $notes = "release-notes.md"
          if ((Test-Path $notes) -and (Get-Item $notes).Length -gt 0) {
            gh release create "$env:TAG" --verify-tag --title "$env:TAG" --notes-file $notes $rel 2>$null
            gh release edit "$env:TAG" $rel --notes-file $notes 2>$null
          } else {
            gh release create "$env:TAG" --verify-tag --title "$env:TAG" --generate-notes $rel 2>$null
            gh release edit "$env:TAG" $rel 2>$null
          }
          # The version goes in the name like every other artifact, and the exe gets
          # a line in the release's sums file. The local cut uploads that file just
          # after pushing the tag, well before this build ends, but wait for it
          # rather than race it. Without it, a .sha256 file goes beside the exe.
          $ver = $env:TAG -replace '^v', ''
          $name = "nemo-anywhere-$ver-windows-x86_64-portable.exe"
          Copy-Item -LiteralPath $exe -Destination $name
          gh release upload "$env:TAG" "$name" --clobber
          $hash = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  $name"
          $sums = "nemo-anywhere-$ver-sha256sums.txt"
          $got = $false
          for ($i = 0; $i -lt 20 -and -not $got; $i++) {
            gh release download "$env:TAG" --pattern $sums --clobber 2>$null
            if ($LASTEXITCODE -eq 0 -and (Test-Path $sums)) { $got = $true } else { Start-Sleep -Seconds 30 }
          }
          if ($got) {
            $kept = @(Get-Content -LiteralPath $sums | Where-Object { $_ -and $_ -notmatch "[ *]$([regex]::Escape($name))$" })
            [IO.File]::WriteAllText((Resolve-Path $sums), ((@($kept) + $line) -join "`n") + "`n")
            gh release upload "$env:TAG" $sums --clobber
          } else {
            [IO.File]::WriteAllText("$PWD/$name.sha256", "$line`n")
            gh release upload "$env:TAG" "$name.sha256" --clobber
          }

      # Last, once the exe and the sums file are up: the Downloads table is read
      # off what the release holds now, so it is right whichever lane finished
      # last. The local cut writes it the same way after its own uploads.
      - name: Downloads table
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash cicd/utility/release-notes.bash --update "${GITHUB_REF_NAME}"
