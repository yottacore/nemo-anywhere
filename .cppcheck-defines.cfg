<?xml version="1.0"?>
<!--
  Macros cppcheck cannot see, since lint-c.bash gives it no include paths, for
  cicd/utility/lint-c.bash and anything else pointed at this tree. Without
  these cppcheck 2.21 stops on the #if that names one, with syntaxError.
-->
<def format="2">
  <!-- clang's, for the sanitizer checks. gcc has none, and says so with __SANITIZE_ADDRESS__. -->
  <define name="__has_feature(x)" value="0"/>
  <!-- Only Tracker 3 is built against. -->
  <define name="TRACKER_CHECK_VERSION(major,minor,micro)" value="1"/>
</def>
